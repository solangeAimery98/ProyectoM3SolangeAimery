<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Arcana | Personajes mágicos</title>

    <link rel="stylesheet" href="/src/styles.css" />
  </head>

  <body>
    <main class="app">
      <!-- =========================================
           DECORATIVE MAGIC
           ========================================= -->

      <div class="magic-particles" aria-hidden="true">
        <span class="particle particle--1">✦</span>
        <span class="particle particle--2">✧</span>
        <span class="particle particle--3">·</span>
        <span class="particle particle--4">✦</span>
        <span class="particle particle--5">·</span>
        <span class="particle particle--6">✧</span>
        <span class="particle particle--7">✦</span>
        <span class="particle particle--8">·</span>
      </div>

      <!-- =========================================
           BACKGROUND
           ========================================= -->

      <div class="background-layers" aria-hidden="true">
        <div class="background-image"></div>
        <div class="background-dark"></div>
        <div class="background-tint"></div>
        <div class="background-glow"></div>
      </div>

      <!-- =========================================
           TAROT FRAME
           ========================================= -->

      <div class="tarot-frame" aria-hidden="true"></div>

      <!-- =========================================
           GLOBAL NAVIGATION
           ========================================= -->

      <header class="site-header">
        <div class="site-header__inner">
          <a class="brand" href="/" aria-label="Arcana - inicio">
            <img
              class="brand__logo"
              src="/src/assets/img/harry-potter-logo-gold.png"
              alt="Harry Potter"
            />

            <span class="brand__name"> ARCANA </span>
          </a>

          <nav class="site-nav" aria-label="Navegación principal">
            <a
              class="site-nav__link site-nav__link--active"
              href="/"
              data-nav-text="characters"
            >
              Personajes
            </a>

            <a class="site-nav__link" href="/about" data-nav-text="about">
              Sobre Arcana
            </a>

            <div class="language-switcher" aria-label="Seleccionar idioma">
              <button
                class="language-switcher__button"
                type="button"
                data-language="es"
                aria-label="Cambiar a español"
              >
                ES
              </button>

              <span class="language-switcher__separator">|</span>

              <button
                class="language-switcher__button"
                type="button"
                data-language="en"
                aria-label="Switch to English"
              >
                EN
              </button>
            </div>
          </nav>
        </div>
      </header>

      <!-- =========================================
           SPA CONTAINER
           ========================================= -->

      <div id="app"></div>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
