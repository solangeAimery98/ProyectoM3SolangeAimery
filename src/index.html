<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hogwarts Chat | Severus Snape</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="chat">
      <header class="chat-header">
        <div class="character-avatar" aria-hidden="true">SS</div>

        <div class="character-info">
          <h1>Severus Snape</h1>
          <p>Profesor de Pociones</p>
        </div>

        <span class="character-status" aria-label="En línea">
          <span class="status-dot"></span>
          <span class="status-text">En línea</span>
        </span>
      </header>

      <section
        class="chat-messages"
        id="chat-messages"
        aria-label="Conversación con Severus Snape"
        aria-live="polite"
      ></section>

      <form class="chat-composer" id="chat-form">
        <label class="visually-hidden" for="message-input">
          Escribe tu mensaje
        </label>

        <input
          type="text"
          id="message-input"
          name="message"
          class="message-input"
          placeholder="Escribe un mensaje..."
          autocomplete="off"
          required
        />

        <button type="submit" class="send-button" aria-label="Enviar mensaje">
          <span aria-hidden="true">➤</span>
        </button>
      </form>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
